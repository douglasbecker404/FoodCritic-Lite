<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff5a36">
  <title>FoodCritic Fácil</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lite.css">
</head>
<body class="app-body">
  <div id="toast-container" class="toast-container"></div>

  <div id="app">
    <aside class="sidebar-left">
      <h1 class="logo-sidebar">FoodCritic Fácil</h1>
      <nav class="nav-menu">
        <button class="nav-btn active" data-nav="inicio" onclick="go('inicio')">
          <i class="fas fa-home"></i> <span>Início</span>
        </button>
        <button class="nav-btn" data-nav="carrinho" onclick="go('carrinho')">
          <i class="fas fa-shopping-bag"></i> <span>Carrinho</span>
          <b class="sidebar-badge" id="cart-badge-sidebar" hidden>0</b>
        </button>
        <button class="nav-btn" data-nav="pedido" onclick="go('pedido')">
          <i class="fas fa-receipt"></i> <span>Meu Pedido</span>
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <div id="view-content"></div>
    </main>

    <aside class="sidebar-right">
      <div id="sidebar-right-content"></div>
    </aside>
  </div>

  <nav class="bottom-nav bottom-nav-facil">
    <button class="nav-btn active" data-nav="inicio" onclick="go('inicio')">
      <i class="fas fa-home"></i><span>Início</span>
    </button>
    <button class="nav-btn" data-nav="carrinho" onclick="go('carrinho')">
      <span class="nav-icon-wrap">
        <i class="fas fa-shopping-bag"></i>
        <b class="cart-badge" id="cart-badge-mobile" hidden>0</b>
      </span>
      <span>Meu Carrinho</span>
    </button>
    <button class="nav-btn" data-nav="pedido" onclick="go('pedido')">
      <i class="fas fa-receipt"></i><span>Meu Pedido</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
